name: Renovar token

# Cada lunes revisa que el token siga andando. El de la página de Facebook no
# vence: si se invalidó (contraseña nueva, permisos sacados), esta corrida
# falla y GitHub manda un mail. Sin token cargado, sale en verde.
on:
  schedule:
    - cron: '23 12 * * 1'   # lunes 09:23 de Uruguay
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Revisar el token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETOS }}
        run: node scripts/renovar-token.mjs
